[mgr]
prepend_keymap = [
  { on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
  { on = "T", run = "plugin toggle-pane min-preview", desc = "Maximize or restore the preview pane" },
  { on = ["c", "m"], run = "plugin chmod", desc = "Chmod on selected files" },
  { on = "y", run = [
    'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list',
    "yank"
  ] },
  { on = "<C-g>", run = 'shell -- rofi -theme fullscreen-preview -show filebrowser -filebrowser-command "ya emit reveal" -filebrowser-directory "$(pwd)"', desc = "Grid view" },
]
